# BLIP configuration for VQA and image captioning

# Model configuration
model:
  name: "blip"
  pretrained: "Salesforce/blip-vqa-base"
  image_size: 224
  max_text_length: 77
  freeze_vision: false
  freeze_text: false

# Data configuration
data:
  batch_size: 16
  num_workers: 4
  image_size: 224
  text_max_length: 77
  augmentation: true

# Training configuration
training:
  learning_rate: 5e-5
  weight_decay: 1e-4
  num_epochs: 20
  warmup_steps: 1000
  gradient_accumulation_steps: 2
  mixed_precision: true
  save_every: 5

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "bleu", "cider", "rouge"]
  batch_size: 32
  save_predictions: true

# General configuration
seed: 42
device: "auto"
output_dir: "./outputs"
log_level: "INFO"
